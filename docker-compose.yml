# ローカル確認用の Verdaccio(publish 先)。README「Verdaccio への publish」を参照。
services:
  verdaccio:
    image: verdaccio/verdaccio:7
    ports:
      - "4873:4873"
    volumes:
      # config.yaml と htpasswd(README の手順で作る。git には入れない)
      - ./verdaccio/conf:/verdaccio/conf
      - verdaccio-storage:/verdaccio/storage
    environment:
      VERDACCIO_PORT: "4873"

volumes:
  verdaccio-storage:
